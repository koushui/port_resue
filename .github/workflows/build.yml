name: Build Port Reuse

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ---- 编译 Windows 客户端 ----
  # ---- 编译 Windows 客户端 ----
  build-windows:
    runs-on: windows-2022
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. 安装 OpenSSL 依赖 (针对 x74 架构)
    # 如果你编译的是 x86，请把下面的 x64-windows 改为 x86-windows
    - name: Install OpenSSL via vcpkg
      run: |
        vcpkg install openssl:x64-windows

    # 2. 整合 vcpkg 到 MSBuild 环境
    - name: Integrate vcpkg
      run: |
        vcpkg integrate install

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: |
        nuget restore client_on_windows/ReverseShell.sln

    # 2. 生成响应文件 (Bypass PowerShell escaping issues completely)
    - name: Create MSBuild Options File
      run: |
        @'
        /p:Configuration=Release
        /p:Platform=x64
        /p:ForceImportBeforeCppTargets="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/msbuild/vcpkg.targets"
        /p:AdditionalOptions="/wd4996"
        /p:PreprocessorDefinitions="NDEBUG;_CONSOLE;_UNICODE;UNICODE;_CRT_SECURE_NO_WARNINGS;_WINSOCK_DEPRECATED_NO_WARNINGS"
        /p:SdlCheck=false
        '@ | Out-File -FilePath msbuild_options.rsp -Encoding utf8

    # 3. 使用响应文件编译解决方案
    - name: Build Windows Client (Release x64)
      shell: cmd
      run: |
        msbuild client_on_windows/ReverseShell.sln @msbuild_options.rsp


  # ---- 编译 Linux 服务端 ----
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make gcc-multilib

    - name: Build Linux Server
      run: |
        cd server_on_linux
        # 如果有 Makefile 则用 make，没有则直接用 gcc 编译 injectme.c
        if [ -f Makefile ]; then
          make
        else
          gcc -shared -fPIC -o injectme.so injectme.c -ldl || echo "Direct compilation skipped"
        fi

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-server-components
        path: |
          server_on_linux/*.sh
          server_on_linux/*.so
