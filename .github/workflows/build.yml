name: Build Port Reuse

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ---- 编译 Windows 客户端 ----
  build-windows:
    runs-on: windows-2022
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet Packages
      run: |
        # 如果项目有依赖 NuGet 包，这一步会自动恢复，没有也不影响
        nuget restore client_on_windows/ReverseShell.sln

    - name: Build Windows Client (Release x86)
      run: |
        # 直接使用 msbuild 编译解决方案
        # 根据项目需要，你可以将 x86 改为 x64
        msbuild client_on_windows/ReverseShell.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-client-binary
        # 收集编译生成的 .exe 文件，过滤掉中间临时文件
        path: |
          client_on_windows/**/Release/*.exe
          client_on_windows/**/Release/*.dll

  # ---- 编译 Linux 服务端 ----
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make gcc-multilib

    - name: Build Linux Server
      run: |
        cd server_on_linux
        # 如果有 Makefile 则用 make，没有则直接用 gcc 编译 injectme.c
        if [ -f Makefile ]; then
          make
        else
          gcc -shared -fPIC -o injectme.so injectme.c -ldl || echo "Direct compilation skipped"
        fi

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-server-components
        path: |
          server_on_linux/*.sh
          server_on_linux/*.so
