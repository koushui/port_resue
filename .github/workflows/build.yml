name: Build Port Reuse

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ---- 编译 Windows 客户端 ----
  build-windows:
    runs-on: windows-2019
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Windows Client
      run: |
        # 寻找目录下的 sln 或 vcxproj 文件进行编译，这里以 Release x86 为例
        # 如果项目没有 sln，可以直接用 cl 命令或 msbuild 编译对应的 .cpp/.c 文件
        cd client_on_windows
        if (Test-Path *.sln) {
          msbuild /p:Configuration=Release /p:Platform=x86
        } elseif (Test-Path *.vcxproj) {
          msbuild /p:Configuration=Release /p:Platform=x86
        } else {
          echo "No solution file found, compiling directly if needed."
        }

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-client
        path: client_on_windows/**/Release/

  # ---- 编译 Linux 服务端 ----
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc make gcc-multilib

    - name: Build Linux Server
      run: |
        cd server_on_linux
        # 如果有 Makefile 则用 make，没有则直接用 gcc 编译 injectme.c
        if [ -f Makefile ]; then
          make
        else
          gcc -shared -fPIC -o injectme.so injectme.c -ldl || echo "Direct compilation skipped"
        fi

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-server-components
        path: |
          server_on_linux/*.sh
          server_on_linux/*.so
